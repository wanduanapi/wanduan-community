name: 功能建议
description: 提出有明确使用场景的 API、MCP 或开发者体验建议。
title: "[Feature] "
labels:
  - feature
  - triage
body:
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 请说明谁在什么场景下遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的能力或行为，不必拘泥于具体实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 如果已有人工处理、第三方服务或其他绕过方式，请说明。
  - type: textarea
    id: additional_context
    attributes:
      label: 补充说明
