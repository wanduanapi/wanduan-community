name: 功能建议
description: 分享一个具体的使用场景，以及你希望万端 API 如何帮助你。
title: "[建议] "
labels:
  - feature
  - triage
body:
  - type: textarea
    id: use_case
    attributes:
      label: 你遇到了什么问题
      description: 请说明谁在什么场景下遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎样解决
      description: 请描述期望的能力或行为，不必拘泥于具体实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在是怎么处理的
      description: 如果已有人工处理、第三方服务或其他绕过方式，请说明。
  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
