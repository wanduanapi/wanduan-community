name: 文档反馈
description: 告诉我们文档哪里写错了、没写清楚或还可以更好。
title: "[文档] "
labels:
  - documentation
  - triage
body:
  - type: input
    id: page_url
    attributes:
      label: 页面地址
      placeholder: "https://docs.wanduanapi.com/..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 哪里需要改进
      placeholder: "请说明错误、遗漏或容易产生歧义的内容。"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 你的建议
      placeholder: "如果有建议的文字或示例，请填写在这里。"
