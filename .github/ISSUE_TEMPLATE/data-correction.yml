name: 节假日数据修订
description: 报告节假日、调休或补班数据可能存在的问题。
title: "[Data] "
labels:
  - data
  - triage
body:
  - type: markdown
    attributes:
      value: |
        节假日数据需要依据正式、可验证的权威文件维护。请不要只根据历史规律推测尚未发布的安排。
  - type: input
    id: year
    attributes:
      label: 年份
      placeholder: "例如 2026"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 日期
      description: 使用 yyyy-MM-dd；如涉及多日，请列出完整日期范围。
      placeholder: "例如 2026-10-01"
    validations:
      required: true
  - type: textarea
    id: current_result
    attributes:
      label: 当前结果
      placeholder: "请说明当前 API 返回的日期类型、节日名称或工作日结果。"
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: 建议结果
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: 权威来源链接
      description: 请提供国务院、国务院办公厅或其他可验证的正式来源。
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: 补充说明
